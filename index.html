<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/funnellegends-logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/funnellegends-logo.svg" />

    <!-- ── Viewport & Mobile ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#22c55e" />

    <!-- ── Primary SEO ── -->
    <title>FunnelLegends | All-in-One Funnel & Marketing Platform</title>
    <meta name="description" content="FunnelLegends — Build, launch and grow with all-in-one funnels, automations, membership, affiliates, appointments and community tools. Start your 30-day free trial." />
    <meta name="keywords" content="funnel builder, sales funnel, marketing automation, membership site, affiliate program, landing page builder" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://funnellegends.com/" />

    <!-- ── Open Graph (Social Sharing) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FunnelLegends | All-in-One Funnel & Marketing Platform" />
    <meta property="og:description" content="Build high-converting funnels, automate your sales process, and scale your online business with FunnelLegends. 30-day free trial." />
    <meta property="og:url" content="https://funnellegends.com/" />
    <meta property="og:site_name" content="FunnelLegends" />
    <meta property="og:image" content="https://funnellegends.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FunnelLegends | All-in-One Funnel & Marketing Platform" />
    <meta name="twitter:description" content="Build high-converting funnels, automate your sales process, and scale your online business with FunnelLegends. 30-day free trial." />
    <meta name="twitter:image" content="https://funnellegends.com/og-image.png" />

    <!-- ── Performance: Preconnect to external origins ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Google Fonts: Only load weights actually used ── -->
    <!-- Inter 400/600/700/800/900 for body; Outfit 600/700/800/900 for headings; Fira Code 400/500 for code blocks -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- ── Structured Data (JSON-LD) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FunnelLegends",
      "applicationCategory": "BusinessApplication",
      "description": "All-in-one funnel builder, CRM, membership, affiliate management, and marketing automation platform.",
      "url": "https://funnellegends.com",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "30-day free trial"
      },
      "operatingSystem": "Web"
    }
    </script>
  </head>
  <body class="bg-white text-gray-900 font-sans antialiased overflow-x-hidden selection:bg-green-200 selection:text-green-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
