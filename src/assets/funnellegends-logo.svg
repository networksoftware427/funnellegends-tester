<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Funnel shape: wide top ellipse ring -->
  <ellipse cx="65" cy="22" rx="32" ry="8" stroke="url(#funnelGrad)" stroke-width="5" fill="none"/>
  
  <!-- Funnel body (narrowing trapezoid lines) -->
  <path d="M33 22 Q42 60 57 82 Q61 90 65 95 Q69 90 73 82 Q88 60 97 22" 
        stroke="url(#funnelGrad)" stroke-width="5" fill="url(#funnelGrad)" fill-opacity="0.15" stroke-linejoin="round"/>

  <!-- Funnel fill solid tapered shape -->
  <path d="M36 24 L58 84 Q62 92 65 96 Q68 92 72 84 L94 24 Q80 30 65 30 Q50 30 36 24Z" 
        fill="url(#funnelGrad)" opacity="0.9"/>

  <!-- Inner swirl line 1 -->
  <path d="M40 32 Q65 38 90 32" stroke="white" stroke-width="2.5" fill="none" stroke-opacity="0.6"/>
  <!-- Inner swirl line 2 -->
  <path d="M47 46 Q65 51 83 46" stroke="white" stroke-width="2" fill="none" stroke-opacity="0.5"/>

  <!-- 7-pointed star at the top center -->
  <g transform="translate(65, 14)">
    <polygon points="0,-10 2.2,-3.1 9.5,-3.1 3.8,1.2 6.0,8.1 0,4.0 -6.0,8.1 -3.8,1.2 -9.5,-3.1 -2.2,-3.1" 
             fill="url(#starGrad)"/>
  </g>

  <!-- FUNNEL text in bright green -->
  <text x="108" y="55" 
        font-family="Inter, Plus Jakarta Sans, sans-serif" 
        font-weight="800" 
        font-size="28" 
        fill="#22c55e" 
        letter-spacing="1">FUNNEL</text>

  <!-- LEGENDS text in dark teal -->
  <text x="108" y="84" 
        font-family="Inter, Plus Jakarta Sans, sans-serif" 
        font-weight="800" 
        font-size="28" 
        fill="#0d7270" 
        letter-spacing="1">LEGENDS</text>
</svg>
